[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-editor"
version = "0.1.0"
description = "GUI editor for retargeted robot motions"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "mujoco>=3.0",
    "glfw",
    "imgui[glfw]",
]

[project.scripts]
motion-editor = "motion_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
